<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        /* Element selector */
        h1 {
            color: blue;
        }

        /* Class selector */
        .heading {
            color: red;
        }

        /* ID selector */
        #hi {
            color: green;
        }
    </style>
</head>

<body>

    <h1 class="heading">Welcome</h1>

    <h1>This is a paragraph.</h1>

    <p id="hi">This is a special paragraph.</p>

</body>
</html>
