<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping Website</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a href="#">MyShop</a>

        <button class="btn btn-primary">
            Cart

        </button>
    </div>
</nav>


<!-- Main Container -->
<div class="container mt-4">
    
    <h1 class="text-center text-primary">
        Welcome to MyShop
    </h1>

    <div class="container">
        Special Offer! Get 20% discount on selected products.
    </div>


    <!-- Product Row -->
    <div class="row">

        <!-- Product 1 -->
        <div class="col-md-4">
            <div class="card">

                <img src="https://via.placeholder.com/300"
                     class="card-img-top"
                     alt="Product">

                <div class="card-body">

                    <h5 class="card-title">
                        Smart Watch
                    </h5>

                    <p class="card-text">
                        Smart watch with fitness tracking.
                    </p>

                    <h6>₹2,999</h6>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>

                </div>
            </div>
        </div>


        <!-- Product 2 -->
        <div class="col-md-4">
            <div class="card">

                <img src="https://via.placeholder.com/300"
                     class="card-img-top"
                     alt="Product">

                <div class="card-body">

                    <h5 class="card-title">
                        Headphones
                    </h5>

                    <p class="card-text">
                        Wireless headphones with good sound.
                    </p>

                    <h6>₹1,499</h6>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>

                </div>
            </div>
        </div>


        <!-- Product 3 -->
        <div class="col-md-4">
            <div class="card">

                <img src="https://via.placeholder.com/300"
                     class="card-img-top"
                     alt="Product">

                <div class="card-body">

                    <h5 class="card-title">
                        Backpack
                    </h5>

                    <p class="card-text">
                        Stylish and durable backpack.
                    </p>

                    <h6>₹999</h6>

                    <button class="btn btn-danger">
                        Add to Cart
                    </button>

                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
