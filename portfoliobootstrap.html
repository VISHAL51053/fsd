<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">VISHAL RAGAV VS</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="#about">About</a>
                <a class="nav-link" href="#skills">Skills</a>
                <a class="nav-link" href="#education">Education</a>
                <a class="nav-link" href="#contact">Contact</a>
            </div>
        </div>
    </nav>
    <main class="container my-4">
        
        <!-- Hero / About -->
        <section id="about" class="p-4 p-md-5 mb-4 bg-light rounded-3 text-center border">
            <h1 class="display-5 fw-bold text-primary">VISHAL RAGAV VS</h1>
            <p class="lead text-secondary"><i>Full-Stack Web Developer & IT Student</i></p>
        </section>

        <!-- Skills Section -->
        <section id="skills" class="mb-4">
            <h2 class="h4 text-primary border-bottom pb-2 mb-3">Technical Skills</h2>
            <ul class="list-group shadow-sm">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span><strong>Frontend:</strong>HTML,CSS,Bootstrap</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span><strong>Tools:</strong> Git, GitHub, VS Code</span>+
                </li>
            </ul>
        </section>

        <!-- Education Section -->
        <section id="education" class="mb-4">
            <h2 class="h4 text-primary border-bottom pb-2 mb-3">Education</h2>
                <table class="table table-hover table-striped border mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Degree</th>
                            <th>Institution</th>
                            <th>Year</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>B.Tech Computer Science</td>
                            <td>State University</td>
                            <td>2023 - 2027</td>
                        </tr>
                    </tbody>
                </table>
        </section>
        <!-- Contact Form Section -->
        <section id="contact" class="mb-4 p-4 border rounded-3 bg-white shadow-sm">
            <h2 class="h4 text-primary border-bottom pb-2 mb-3">Contact Me</h2>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="msg" class="form-label fw-semibold">Message</label>
                    <textarea class="form-control" id="msg" rows="3" placeholder="Write your message here..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary px-4">Send Message</button>
            </form>
        </section>
    </main>
</body>
</html>
